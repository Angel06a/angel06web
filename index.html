<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Angel06Web</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000">
  <link rel="preload" href="./img/Fondo.webp" as="image">
  <link rel="icon" type="image/webp" href="./img/favicon.webp">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="bg-overlay"></div>

  <header>
    <h1>
      <span id="header-title"></span>
    </h1>
    <div>
      <span class="slot-inline" data-slot="header-actions"></span>
      <button id="config-btn" type="button" title="Configuración" aria-label="Configuración">
        <img src="./img/config.webp" alt="" class="config-icon">
      </button>
    </div>
  </header>

  <div class="container">
    <aside class="sidebar-left">
      <div class="slot" data-slot="sidebar-top"></div>
      <div class="search-bar">
        <input type="text" placeholder="Buscar..." aria-label="Buscar" autocomplete="off" enterkeyhint="search" />
        <button type="button" id="search-clear" class="search-clear" aria-label="Borrar búsqueda" title="Borrar búsqueda" hidden>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
      <nav aria-label="Categorías">
        <ul id="sidebar-categories"></ul>
      </nav>
      <div class="slot" data-slot="sidebar-bottom"></div>
    </aside>

    <main id="main-content">
      <div class="slot" data-slot="main-top"></div>
      <div id="tabs-container">
        <section id="busqueda" class="tab-content">
          <h2 id="busqueda-title">Búsqueda</h2>
          <div class="project-list">
            <div class="list-container">
              <ul id="busqueda-list"></ul>
            </div>
          </div>
        </section>
      </div>
      <div class="slot" data-slot="main-bottom"></div>
      <div class="download-section">
        <button type="button" class="download-section-btn" id="primary-download-btn" disabled>Descargar</button>
        <button type="button" class="download-section-btn" id="secondary-download-btn" style="display: none;">Descargar</button>
      </div>
    </main>

    <aside class="sidebar-right" data-slot="sidebar-right"></aside>
  </div>

  <div id="config-panel" role="dialog" aria-modal="true" aria-labelledby="config-title">
    <div class="config-header">
      <h3 id="config-title">Configuración</h3>
      <button class="close" id="config-close-btn" type="button" title="Cerrar" aria-label="Cerrar">✖</button>
    </div>

    <div class="config-separator"></div>

    <div class="config-options" id="config-options"></div>
  </div>

  <footer>
    <p id="footer-text"></p>
  </footer>

  <script src="js/list.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
