<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script>
    // Calcula la carpeta base del sitio y restaura la ruta que llega desde 404.html
    (function () {
      var base = location.pathname.replace(/[^\/]*$/, '');
      var p = new URLSearchParams(location.search).get('p');
      if (p !== null) {
        try { history.replaceState(null, '', base + p.replace(/^\/+/, '')); } catch (e) {}
      }
      window.SITE_BASE = base;
      // Hace que ./img, css/, js/ funcionen igual desde cualquier "subcarpeta" simulada
      document.write('<base href="' + base + '">');
    })();
  </script>

  <title>Angel06 Web – Descargas de juegos y programas para PC y Android</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Angel06 Web: buscador y lista de descargas de juegos, programas y aplicaciones para Windows, Android y web. Encuentra lo que buscas por categorías.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="https://angel06a.github.io/angel06web/">

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Angel06 Web">
  <meta property="og:locale" content="es_ES">
  <meta property="og:title" content="Angel06 Web – Descargas de juegos y programas para PC y Android">
  <meta property="og:description" content="Buscador y lista de descargas de juegos, programas y aplicaciones para Windows, Android y web.">
  <meta property="og:url" content="https://angel06a.github.io/angel06web/">
  <meta property="og:image" content="https://angel06a.github.io/angel06web/img/Fondo.webp">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="./img/Fondo.webp" as="image">
  <link rel="icon" type="image/webp" href="./img/favicon.webp">
  <link rel="stylesheet" href="css/style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Angel06 Web",
    "url": "https://angel06a.github.io/angel06web/",
    "inLanguage": ["es", "en"]
  }
  </script>
</head>
<body>
  <div id="bg-overlay"></div>

  <header>
    <h1>
      <span id="header-title"></span>
    </h1>
    <div class="header-actions">
      <!-- Grupo 1: enlaces externos -->
      <div class="header-links">
        <span class="slot-inline" data-slot="header-actions"></span>
      </div>

      <span class="header-sep" aria-hidden="true"></span>

      <!-- Grupo 2: preferencias (idioma + configuración) -->
      <div class="header-controls">
        <div class="lang-menu" id="lang-menu">
          <button id="lang-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="lang-list">
            <svg class="lang-globe" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 3.9 5.7 3.9 9s-1.3 6.3-3.9 9c-2.6-2.7-3.9-5.7-3.9-9S9.4 5.7 12 3z"/></svg>
            <span id="lang-current">ES</span>
            <svg class="lang-chevron" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <ul id="lang-list" role="listbox" tabindex="-1" hidden></ul>
        </div>
        <button id="config-btn" type="button" title="Configuración" aria-label="Configuración">
          <img src="./img/config.webp" alt="" class="config-icon">
        </button>
      </div>
    </div>
  </header>

  <div class="container">
    <aside class="sidebar-left">
      <div class="slot" data-slot="sidebar-top"></div>
      <div class="search-bar">
        <input type="text" placeholder="Buscar..." aria-label="Buscar" autocomplete="off" enterkeyhint="search" />
        <button type="button" id="search-clear" class="search-clear" aria-label="Borrar búsqueda" title="Borrar búsqueda" hidden>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
      <nav aria-label="Categorías">
        <ul id="sidebar-categories"></ul>
      </nav>
      <div class="slot" data-slot="sidebar-bottom"></div>
    </aside>

    <main id="main-content">
      <div class="slot" data-slot="main-top"></div>
      <noscript>
        <p>Angel06 Web: lista de descargas de juegos, programas y aplicaciones para Windows y Android. Activa JavaScript para ver el catálogo y usar el buscador.</p>
      </noscript>
      <div id="tabs-container">
        <section id="busqueda" class="tab-content">
          <h2 id="busqueda-title">Búsqueda</h2>
          <div class="project-list">
            <div class="list-container">
              <ul id="busqueda-list"></ul>
            </div>
          </div>
        </section>
      </div>
      <div class="slot" data-slot="main-bottom"></div>
      <div class="download-section">
        <button type="button" class="download-section-btn" id="primary-download-btn" disabled>Descargar</button>
        <button type="button" class="download-section-btn" id="secondary-download-btn" style="display: none;">Descargar</button>
      </div>
    </main>

    <aside class="sidebar-right" data-slot="sidebar-right"></aside>
  </div>

  <div id="config-panel" role="dialog" aria-modal="true" aria-labelledby="config-title">
    <div class="config-header">
      <h3 id="config-title">Configuración</h3>
      <button class="close" id="config-close-btn" type="button" title="Cerrar" aria-label="Cerrar">✖</button>
    </div>

    <div class="config-separator"></div>

    <div class="config-options" id="config-options"></div>
  </div>

  <footer>
    <p id="footer-text"></p>
  </footer>

  <script src="js/list.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
