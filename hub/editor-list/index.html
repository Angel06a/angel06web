<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de list.js</title>
<style>
:root{--p:#1abc9c;--ph:#16a085;--bg:#1f1f1f;--card:#2a2a2a;--in:#161616;--b:rgba(255,255,255,.12);--t:#f0f6fc;--m:#8b949e;--r:10px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--t);font:14px 'Segoe UI',system-ui,sans-serif}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--b);background:#242424}
header h1{margin:0 auto 0 0;font-size:16px;font-weight:600}
button{font:inherit;color:var(--t);background:rgba(255,255,255,.06);border:1px solid var(--b);border-radius:8px;padding:6px 12px;cursor:pointer;transition:.15s}
button:hover{background:rgba(255,255,255,.12)}
button:focus-visible,input:focus-visible{outline:2px solid var(--p);outline-offset:1px}
button.pri{background:var(--p);border-color:var(--p);color:#fff;font-weight:600}
button.pri:hover{background:var(--ph)}
button.danger:hover{background:rgba(239,68,68,.25);border-color:#ef4444}
button.sm{padding:3px 8px;font-size:12px}
#status{color:var(--m);font-size:12px;min-height:16px;padding:0 16px;margin-top:6px}
.tabs{display:flex;gap:6px;padding:10px 16px 0}
.tabs button{border-radius:8px 8px 0 0;border-bottom:none;padding:8px 22px;font-weight:600}
.tabs button.on{background:var(--p);border-color:var(--p);color:#fff}
.wrap{flex:1;display:flex;min-height:0;border-top:1px solid var(--b)}
#side{width:270px;flex-shrink:0;border-right:1px solid var(--b);display:flex;flex-direction:column;min-height:0}
#cats{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:4px}
.cat{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--b);border-radius:8px;cursor:pointer;background:rgba(255,255,255,.03)}
.cat:hover{background:rgba(255,255,255,.08)}
.cat.on{border-color:var(--p);background:rgba(26,188,156,.16)}
.cat .n{color:var(--m);font-size:12px}
.sidetools{display:flex;gap:4px;flex-wrap:wrap;padding:8px;border-top:1px solid var(--b)}
#main{flex:1;overflow:auto;padding:14px 16px 40px;min-width:0}
.box,.row{background:var(--card);border:1px solid var(--b);border-radius:var(--r);padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.s1{grid-column:span 1}.s2{grid-column:span 2}.s3{grid-column:span 3}.s6{grid-column:span 6}
.f label{display:block;color:var(--m);font-size:11px;margin-bottom:3px}
input[type=text]{width:100%;padding:7px 9px;background:var(--in);color:var(--t);border:1px solid var(--b);border-radius:7px;font:inherit}
input[type=text]:focus{border-color:var(--p);outline:none}
input::placeholder{color:#5c636b}
.row{display:flex;gap:10px}
.row .grid{flex:1;min-width:0}
.acts{display:flex;flex-direction:column;gap:4px}
.hint{color:var(--m);font-size:12px;line-height:1.5;margin:0 0 12px}
.hint code{background:var(--in);padding:1px 5px;border-radius:4px;color:#cfe}
.empty{color:var(--m);padding:40px 10px;text-align:center}
h3{margin:14px 0 8px;font-size:13px;color:var(--m);font-weight:600}
.sorthead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 8px}
.sorthead h3{margin:0}
.sorthead .tools{display:flex;gap:6px;flex-wrap:wrap}
.searchbox{padding:8px 8px 0}
.qwrap{position:relative}
#q{padding-right:30px}
#qclear{position:absolute;right:4px;top:50%;transform:translateY(-50%);padding:2px 7px;border:none;background:none;color:var(--m)}
#qclear:hover{color:var(--t);background:none}
.hit{flex-direction:column;justify-content:flex-start;gap:2px}
.hit .t,.hit .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit:focus-visible{outline:2px solid var(--p);outline-offset:1px}
.hitinfo{color:var(--m);font-size:12px;padding:2px 4px}
.row.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,35%{border-color:var(--p);box-shadow:0 0 0 2px rgba(26,188,156,.5)}100%{border-color:var(--b);box-shadow:none}}
@media(max-width:800px){.wrap{flex-direction:column}#side{width:100%;max-height:34vh;border-right:none;border-bottom:1px solid var(--b)}.grid{grid-template-columns:repeat(2,1fr)}.s1,.s2,.s3,.s6{grid-column:span 2}}
</style>
</head>
<body>
<header>
  <h1>Editor de list.js</h1>
  <input type="file" id="file" accept=".js,.txt" hidden>
  <button id="open">Abrir list.js</button>
  <button id="copy">Copiar código</button>
  <button id="save" class="pri">Descargar list.js</button>
</header>
<div id="status">Abre tu list.js para empezar (si solo tiene un idioma, el inglés se crea como copia del español).</div>
<div class="tabs">
  <button id="tab-es" data-lang="es">Español</button>
  <button id="tab-en" data-lang="en">English</button>
</div>
<div class="wrap">
  <div id="side">
    <div class="searchbox">
      <div class="qwrap">
        <input type="text" id="q" placeholder="Buscar elemento…  ( / )" aria-label="Buscar elemento" autocomplete="off">
        <button id="qclear" type="button" title="Borrar búsqueda" aria-label="Borrar búsqueda" hidden>✕</button>
      </div>
    </div>
    <div id="cats"></div>
    <div class="sidetools">
      <button id="cadd" class="sm pri">+ Categoría</button>
      <button id="cup" class="sm" title="Subir">↑</button>
      <button id="cdn" class="sm" title="Bajar">↓</button>
      <button id="cdel" class="sm danger" title="Eliminar categoría">Eliminar</button>
    </div>
  </div>
  <div id="main"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data = [], lang = 'es', ci = 0, cj = -1; // cj = elemento resaltado desde la búsqueda

/* ---------- Lectura ---------- */
function parseBlock(text) {
  const cats = []; let cur = null;
  text.split('\n').forEach(raw => {
    const line = raw.trim(); if (!line) return;
    if (line.startsWith('-')) {
      if (!cur) return;
      let c = line.slice(1).trim();
      const links = (c.match(/"([^"]*)"/g) || []).map(x => x.slice(1, -1));
      c = c.replace(/"([^"]*)"/g, '').trim();
      const st = (c.match(/\*([^*]+)\*/g) || []).map(x => x.slice(1, -1));
      c = c.replace(/\*([^*]+)\*/g, '');
      let extra = ''; const m = c.match(/=([^=]+)=/);
      if (m) { extra = m[1].trim(); c = c.replace(m[0], ''); }
      const tags = [...c.matchAll(/\[([^\[\]]+)\]/g)].map(m => m[1].trim());
      c = c.replace(/\[[^\[\]]*\]/g, '');
      cur.items.push({ name: c.replace(/\s{2,}/g, ' ').trim(), tags, extra, link1: links[0] || '', link2: links[1] || '', b1: st[0] || '', b2: st[1] || '' });
    } else if (line.endsWith(':')) {
      let n = line.slice(0, -1).trim(), extra = '';
      const m = n.match(/=([^=]+)=/);
      if (m) { extra = m[1].trim(); n = n.replace(/=([^=]+)=/g, '').trim(); }
      cur = { name: n, extra, items: [] }; cats.push(cur);
    }
  });
  return cats;
}

function merge(es, en) {
  return es.map((c, i) => {
    const e = en[i] || c;
    return {
      es: { name: c.name, extra: c.extra }, en: { name: e.name, extra: e.extra },
      items: c.items.map((it, j) => {
        const x = (e.items || [])[j] || it;
        return { link1: it.link1, link2: it.link2,
          es: { name: it.name, tags: it.tags, extra: it.extra, b1: it.b1, b2: it.b2 },
          en: { name: x.name, tags: [...x.tags], extra: x.extra, b1: x.b1, b2: x.b2 } };
      })
    };
  });
}

function loadText(txt) {
  const un = s => s.replace(/\\([`$\\])/g, '$1');
  const re = /\b(es|en)\s*:\s*`([\s\S]*?)`/g; let m; const o = {};
  while ((m = re.exec(txt))) o[m[1]] = un(m[2]);
  if (!o.es) { const m2 = txt.match(/`([\s\S]*?)`/); if (m2) o.es = un(m2[1]); }
  if (!o.es) throw new Error('No se encontró el texto de la lista en el archivo.');
  const es = parseBlock(o.es);
  data = merge(es, o.en ? parseBlock(o.en) : parseBlock(o.es));
  ci = 0; cj = -1; clearSearch();
  status(`Cargado: ${data.length} categorías, ${data.reduce((n, c) => n + c.items.length, 0)} elementos.` + (o.en ? '' : ' Inglés creado como copia del español.'));
  render();
}

/* ---------- Exportación ---------- */
const ex = s => s.replace(/[\\`]/g, '\\$&').replace(/\$\{/g, '\\${');
function block(l) {
  return data.map(c => {
    const h = c[l];
    let out = `${h.name}${h.extra ? `=${h.extra}=` : ''}:`;
    c.items.forEach(it => {
      const x = it[l];
      const links = [it.link1, it.link2].filter(Boolean).map(v => `"${v}"`).join(' ');
      const btns = [x.b1, x.b2].filter(Boolean).map(v => `*${v}*`).join(' ');
      out += '\n  -' + [[x.name, x.tags.filter(Boolean).map(t => `[${t}]`).join('')].filter(Boolean).join(' ') + (x.extra ? ` =${x.extra}=` : ''), links, btns].filter(Boolean).join(' ');
    });
    return out;
  }).join('\n');
}
function exportText() {
  return `// list.js — se puede editar a mano o con editor-list.html\n// Mismo formato en ambos idiomas; el orden de categorías y elementos debe coincidir.\nconst listData = {\n  es: \`\n${ex(block('es'))}\n\`,\n  en: \`\n${ex(block('en'))}\n\`\n};\n`;
}

/* ---------- Interfaz ---------- */
function status(t) { $('#status').textContent = t; }
const other = () => lang === 'es' ? 'en' : 'es';

/* ---------- Búsqueda ---------- */
// Sin tildes ni mayúsculas; los marcadores (emoji.windows…) cuentan como palabras
const norm = s => String(s ?? '').replace(/\(emoji\.(windows|android|web)\)/g, ' $1 ')
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

// null = sin búsqueda activa; si no, lista de {i, j}
function hits() {
  const tokens = norm($('#q').value).split(/\s+/).filter(Boolean);
  if (!tokens.length) return null;
  const out = [];
  data.forEach((c, i) => {
    const cat = norm(`${c.es.name} ${c.en.name} ${c.es.extra} ${c.en.extra}`);
    c.items.forEach((it, j) => {
      const txt = norm([it.es.name, it.en.name, it.es.extra, it.en.extra, ...it.es.tags, ...it.en.tags, it.link1, it.link2].join(' ')) + ' ' + cat;
      if (tokens.every(t => txt.includes(t))) out.push({ i, j });
    });
  });
  return out;
}

function clearSearch() { $('#q').value = ''; $('#qclear').hidden = true; }

function focusItem(j) {
  const row = document.querySelectorAll('#main .row')[j];
  if (!row) return;
  row.scrollIntoView({ block: 'center', behavior: 'smooth' });
  row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
  row.querySelector('input')?.focus({ preventScroll: true });
}

function renderCats() {
  const h = hits();
  if (h) {
    $('#cats').innerHTML = !h.length ? '<div class="empty">Sin resultados</div>'
      : `<div class="hitinfo">${h.length} resultado${h.length === 1 ? '' : 's'}</div>` + h.map(({ i, j }) => {
        const c = data[i], it = c.items[j];
        return `<div class="cat hit ${i === ci && j === cj ? 'on' : ''}" tabindex="0" role="button" data-hi="${i}" data-hj="${j}"><span class="t">${esc(it[lang].name || it[other()].name || '(sin nombre)')}</span><span class="n">${esc(c[lang].name || c[other()].name || '(sin nombre)')}</span></div>`;
      }).join('');
    return;
  }
  $('#cats').innerHTML = data.map((c, i) =>
    `<div class="cat ${i === ci ? 'on' : ''}" data-cat="${i}"><span>${esc(c[lang].name || '(sin nombre)')}</span><span class="n">${c.items.length}</span></div>`).join('');
}

function renderMain() {
  const c = data[ci], o = other();
  if (!c) { $('#main').innerHTML = '<div class="empty">No hay categorías. Abre tu list.js o crea una con “+ Categoría”.</div>'; return; }
  const field = (cls, label, attr, val, ph) =>
    `<div class="f ${cls}"><label>${label}</label><input type="text" ${attr} value="${esc(val)}" placeholder="${esc(ph)}"></div>`;
  const items = c.items.map((it, j) => `
    <div class="row">
      <div class="grid">
        ${field('s3', 'Nombre', `data-i="${j}" data-k="name"`, it[lang].name, it[o].name)}
        ${field('s1', 'Extra (=…=)', `data-i="${j}" data-k="extra"`, it[lang].extra, it[o].extra)}
        ${field('s1', 'Botón 1', `data-i="${j}" data-k="b1"`, it[lang].b1, it[o].b1)}
        ${field('s1', 'Botón 2', `data-i="${j}" data-k="b2"`, it[lang].b2, it[o].b2)}
        ${Array.from({ length: Math.max(3, it[lang].tags.length, it[o].tags.length) }, (_, k) => field('s2', 'Etiqueta ' + (k + 1) + ' [ ]', `data-i="${j}" data-k="tag" data-t="${k}"`, it[lang].tags[k] || '', it[o].tags[k] || '')).join('')}
        ${field('s3', 'Enlace 1 (igual en ambos idiomas)', `data-i="${j}" data-k="link1"`, it.link1, '')}
        ${field('s3', 'Enlace 2 (igual en ambos idiomas)', `data-i="${j}" data-k="link2"`, it.link2, '')}
      </div>
      <div class="acts">
        <button class="sm" data-act="up" data-i="${j}" title="Subir">↑</button>
        <button class="sm" data-act="down" data-i="${j}" title="Bajar">↓</button>
        <button class="sm danger" data-act="del" data-i="${j}" title="Eliminar">✕</button>
      </div>
    </div>`).join('');
  $('#main').innerHTML = `
    <p class="hint">Las etiquetas se escriben sin corchetes, una por casilla. Iconos: <code>(emoji.windows)</code> <code>(emoji.android)</code> <code>(emoji.web)</code>. El texto gris es el del otro idioma. Añadir, mover o borrar afecta a los dos idiomas a la vez, para que sigan alineados.</p>
    <div class="box"><div class="grid">
      ${field('s3', 'Categoría', 'data-cf="name"', c[lang].name, c[o].name)}
      ${field('s3', 'Extra de categoría (=…=)', 'data-cf="extra"', c[lang].extra, c[o].extra)}
    </div></div>
    <div class="sorthead"><h3>Elementos (${c.items.length})</h3><div class="tools"><button class="pri sm" data-act="add">+ Elemento</button><button class="sm" data-act="sort" title="Ordenar los elementos de esta categoría alfabéticamente">Ordenar A→Z</button></div></div>${items}`;
}

function render() {
  $('#tab-es').classList.toggle('on', lang === 'es');
  $('#tab-en').classList.toggle('on', lang === 'en');
  renderCats(); renderMain();
}

/* ---------- Ordenar A→Z ---------- */
// Usa el nombre del idioma activo (o el del otro si está vacío), sin distinguir mayúsculas/tildes y con números naturales.
// Como cada elemento guarda ambos idiomas juntos, el orden se aplica a es y en a la vez.
function sortAZ(arr) {
  const col = new Intl.Collator(lang, { sensitivity: 'base', numeric: true });
  const nm = o => (o[lang].name || o[other()].name || '').trim();
  return arr.sort((a, b) => {
    const x = nm(a), y = nm(b);
    if (!x && !y) return 0;
    if (!x) return 1;   // los vacíos al final
    if (!y) return -1;
    return col.compare(x, y);
  });
}

/* ---------- Eventos ---------- */
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { lang = b.dataset.lang; render(); });
$('#cats').onclick = e => {
  const h = e.target.closest('.hit');
  if (h) { ci = +h.dataset.hi; cj = +h.dataset.hj; render(); focusItem(cj); return; }
  const el = e.target.closest('.cat');
  if (el) { ci = +el.dataset.cat; cj = -1; render(); }
};

// Búsqueda: escribir filtra, Enter abre el primer resultado, Esc borra
$('#q').addEventListener('input', () => { $('#qclear').hidden = !$('#q').value; renderCats(); });
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); clearSearch(); renderCats(); }
  else if (e.key === 'Enter') { e.preventDefault(); $('#cats .hit')?.click(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); $('#cats .hit')?.focus(); }
});
$('#qclear').onclick = () => { clearSearch(); renderCats(); $('#q').focus(); };
$('#cats').addEventListener('keydown', e => {
  const el = e.target.closest('.hit'); if (!el) return;
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); el.nextElementSibling?.focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); (el.previousElementSibling?.classList.contains('hit') ? el.previousElementSibling : $('#q')).focus(); }
});
// "/" enfoca la búsqueda desde cualquier parte
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName) && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault(); $('#q').focus(); $('#q').select();
  }
});

$('#main').addEventListener('input', e => {
  const t = e.target, c = data[ci];
  if (!c) return;
  if (t.dataset.cf) { c[lang][t.dataset.cf] = t.value; renderCats(); return; }
  const it = c.items[+t.dataset.i], k = t.dataset.k; if (!it) return;
  if (k === 'link1' || k === 'link2') it[k] = t.value;
  else if (k === 'tag') { const a = it[lang].tags, n = +t.dataset.t; while (a.length <= n) a.push(''); a[n] = t.value.replace(/[\[\]]/g, ''); }
  else it[lang][k] = t.value;
  renderCats(); // mantiene al día los resultados de la búsqueda
});

$('#main').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const c = data[ci], i = +b.dataset.i, a = b.dataset.act, arr = c.items;
  if (a === 'add') { arr.push({ link1: '', link2: '', es: { name: '', tags: [], extra: '', b1: '', b2: '' }, en: { name: '', tags: [], extra: '', b1: '', b2: '' } }); render(); const r = document.querySelectorAll('.row'); r[r.length - 1]?.querySelector('input').focus(); return; }
  if (a === 'sort') {
    if (arr.length < 2) return;
    if (!confirm('¿Ordenar alfabéticamente los elementos de esta categoría? Se perderá el orden actual.')) return;
    sortAZ(arr); cj = -1; render();
    status(`Elementos de «${c[lang].name || '(sin nombre)'}» ordenados de la A a la Z (según ${lang === 'es' ? 'español' : 'inglés'}, en ambos idiomas).`);
    return;
  }
  cj = -1;
  if (a === 'del') arr.splice(i, 1);
  if (a === 'up' && i > 0) [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
  if (a === 'down' && i < arr.length - 1) [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];
  render();
});

$('#cadd').onclick = () => { clearSearch(); data.push({ es: { name: 'Nueva categoría', extra: '' }, en: { name: 'New category', extra: '' }, items: [] }); ci = data.length - 1; render(); };
$('#cdel').onclick = () => { if (data[ci] && confirm('¿Eliminar la categoría y todos sus elementos?')) { clearSearch(); cj = -1; data.splice(ci, 1); ci = Math.max(0, ci - 1); render(); } };
$('#cup').onclick = () => { if (ci > 0) { clearSearch(); cj = -1; [data[ci - 1], data[ci]] = [data[ci], data[ci - 1]]; ci--; render(); } };
$('#cdn').onclick = () => { if (ci < data.length - 1) { clearSearch(); cj = -1; [data[ci + 1], data[ci]] = [data[ci], data[ci + 1]]; ci++; render(); } };

$('#open').onclick = () => $('#file').click();
$('#file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { loadText(r.result); } catch (err) { status('Error: ' + err.message); } };
  r.readAsText(f); e.target.value = '';
};
$('#save').onclick = () => {
  if (!data.length) return status('No hay nada que exportar.');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([exportText()], { type: 'text/javascript' }));
  a.download = 'list.js'; a.click(); URL.revokeObjectURL(a.href);
  status('list.js descargado. Sustituye el de tu carpeta js/.');
};
$('#copy').onclick = async () => {
  try { await navigator.clipboard.writeText(exportText()); status('Código copiado al portapapeles.'); }
  catch { status('No se pudo copiar; usa “Descargar list.js”.'); }
};
render();
</script>
</body>
</html>
